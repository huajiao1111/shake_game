<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>贪吃蛇 · 小游戏</title>
  <meta name="description" content="一个用 HTML5 Canvas 写的极简贪吃蛇小游戏。单文件、离线可玩。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23fafaf7'/%3E%3Ccircle cx='23' cy='9' r='4' fill='%23e0574c'/%3E%3Crect x='5' y='15' width='9' height='9' fill='%2348a868'/%3E%3Crect x='14' y='15' width='9' height='9' fill='%231f6b45'/%3E%3C/svg%3E" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #ffffff;
      color: #333333;
      font-family: system-ui, "Microsoft YaHei", sans-serif;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
    }
    canvas {
      border-radius: 8px;
      box-shadow: 0 0 0 1px #e5e5e5;
    }
    .tip {
      margin: 0;
      font-size: 13px;
      color: #888888;
      height: 18px;
    }
    .score {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: #1f6b45;
    }
    /* 屏幕上的方向键：键盘不好使时用它 */
    .pad {
      display: grid;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(2, 44px);
      gap: 6px;
    }
    .pad .up    { grid-column: 2; grid-row: 1; }
    .pad .left  { grid-column: 1; grid-row: 2; }
    .pad .down  { grid-column: 2; grid-row: 2; }
    .pad .right { grid-column: 3; grid-row: 2; }
    .btn {
      border: 1px solid #dcdcd6;
      background: #ffffff;
      border-radius: 8px;
      font-size: 18px;
      color: #444444;
      cursor: pointer;
      font-family: inherit;
    }
    .btn:hover { background: #f2f2ee; }
    .btn:active { background: #e6e6e0; }
    .restart {
      font-size: 13px;
      padding: 6px 14px;
      color: #666666;
    }
  </style>
</head>
<body>
  <h1>贪吃蛇</h1>
  <p class="score" id="score">得分 0</p>
  <canvas id="game" width="400" height="400" tabindex="0"></canvas>
  <div class="pad">
    <button class="btn up"    data-dir="up">↑</button>
    <button class="btn left"  data-dir="left">←</button>
    <button class="btn down"  data-dir="down">↓</button>
    <button class="btn right" data-dir="right">→</button>
  </div>
  <button class="btn restart" id="restart">重新开始</button>
  <p class="tip" id="tip">点一下画面，然后用方向键控制</p>

  <script>
  // ============================================================
  // 贪吃蛇 · 单文件小游戏
  //
  // 玩法：方向键 或 WASD 控制方向，撞墙会从对面穿出去，
  //       吃到红球变长、得分 +1，咬到自己就结束。
  //       按 R 或点「重新开始」重来。
  //
  // 想改手感，搜索下面这两个参数：
  //   SPEED  每秒走几格，数字越大蛇越快
  //   CELL   每格多少像素。注意：改它要同时改上面 canvas 的
  //          width / height（画布大小 = CELL × 20）
  // ============================================================

  // ========== 1. 基本参数 ==========
  const CELL = 20;            // 每一格 20 像素
  const COLS = 20;            // 横向 20 格（20 × 20 = 400 像素）
  const ROWS = 20;            // 纵向 20 格
  const SPEED = 5;            // 每秒走几格，数字越大蛇越快

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const tip = document.getElementById('tip');
  const scoreEl = document.getElementById('score');

  // ========== 2. 游戏状态 ==========
  let snake;    // 蛇身：一个数组，snake[0] 是蛇头
  let dir;      // 当前方向，比如 {x: 1, y: 0} 表示向右
  let food;     // 小球的位置 {x, y}
  let score;    // 得分
  let over;     // 游戏是否已经结束
  let timer = null;

  function reset() {
    // 初始三节，躺在第 10 行，头在 x = 5
    snake = [{ x: 5, y: 10 }, { x: 4, y: 10 }, { x: 3, y: 10 }];
    dir = { x: 1, y: 0 };
    score = 0;
    over = false;
    updateScore();
    newFood();
    tip.textContent = '点一下画面，然后用方向键控制';
  }

  function updateScore() {
    scoreEl.textContent = '得分 ' + score;
  }

  // 在所有空格子里随机挑一个放球，保证球不会长在蛇身上
  function newFood() {
    const empty = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (!snake.some((seg) => seg.x === x && seg.y === y)) empty.push({ x, y });
      }
    }

    if (empty.length === 0) {   // 蛇占满整块场地，算通关
      food = null;
      stop();
      tip.textContent = '通关了！整块场地都是你的蛇';
      return;
    }

    food = empty[Math.floor(Math.random() * empty.length)];
  }

  // ========== 3. 每"走一格"发生的事 ==========
  function step() {
    if (over) return;   // 已经结束了，别再走

    const head = snake[0];

    // 穿墙：走到边界外面就绕回对面
    // 先加 COLS / ROWS 再取余，是因为 JS 里 -1 % 20 等于 -1 而不是 19
    const next = {
      x: (head.x + dir.x + COLS) % COLS,
      y: (head.y + dir.y + ROWS) % ROWS,
    };

    // 这一步会不会吃到球？
    const ate = food !== null && next.x === food.x && next.y === food.y;

    // 咬到自己了吗？
    // 细节：如果这一步没吃到球，尾巴会同时从它现在的位置移开，
    // 所以"撞上正在离开的那节尾巴"不该算死，否则会误判
    const body = ate ? snake : snake.slice(0, snake.length - 1);
    const hitSelf = body.some((seg) => seg.x === next.x && seg.y === next.y);

    if (hitSelf) {
      over = true;
      stop();
      tip.textContent = '咬到自己了 · 得分 ' + score + '，按 R 或点「重新开始」';
      return;
    }

    snake.unshift(next);   // 新的一节放到数组最前面，成为新蛇头
    if (!ate) snake.pop(); // 没吃到：去掉尾巴，长度不变
                           // 吃到了：不去尾巴，长度 +1

    if (ate) {
      score += 1;
      updateScore();
      newFood();           // 球换个位置
    }
  }

  // ========== 4. 把当前状态画到画布上 ==========
  function draw() {
    // 背景
    ctx.fillStyle = '#fafaf7';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 淡淡的网格线，方便看清"格子"这个概念
    ctx.strokeStyle = '#eeeeea';
    ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, canvas.height);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, i * CELL);
      ctx.lineTo(canvas.width, i * CELL);
      ctx.stroke();
    }

    // 小球：画在蛇下面，被吃掉时会被蛇挡住
    if (food !== null) {
      ctx.beginPath();
      ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL * 0.32, 0, Math.PI * 2);
      ctx.fillStyle = '#e0574c';
      ctx.fill();
    }

    // 蛇：蛇头深一点，身体浅一点
    snake.forEach((seg, i) => {
      ctx.fillStyle = i === 0 ? '#1f6b45' : '#48a868';
      ctx.fillRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2);
    });

    // 结束时盖一层半透明遮罩，写上结果
    if (over) {
      ctx.fillStyle = 'rgba(20, 20, 20, 0.45)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 26px system-ui, "Microsoft YaHei", sans-serif';
      ctx.fillText('游戏结束', canvas.width / 2, canvas.height / 2 - 10);
      ctx.font = '16px system-ui, "Microsoft YaHei", sans-serif';
      ctx.fillText('得分 ' + score, canvas.width / 2, canvas.height / 2 + 24);
      ctx.textAlign = 'left';   // 还原，免得影响后面的绘制
    }
  }

  // ========== 5. 控制方式：键盘 + 屏幕按钮 ==========
  const DIRS = {
    up:    { x: 0,  y: -1 },
    down:  { x: 0,  y: 1 },
    left:  { x: -1, y: 0 },
    right: { x: 1,  y: 0 },
  };

  const NAMES = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
  };

  // 所有控制方式最后都走这一个函数，规则只写一次
  function setDirection(wanted) {
    // 不能 180 度掉头，否则会立刻撞上自己的脖子
    if (wanted.x === -dir.x && wanted.y === -dir.y) return;
    dir = wanted;
  }

  // 键盘（需要先把焦点点到页面里）
  window.addEventListener('keydown', (e) => {
    const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;

    if (key === 'r') {
      restart();
      return;
    }

    const name = NAMES[key];
    if (!name) return;

    e.preventDefault();  // 防止方向键把页面滚动
    setDirection(DIRS[name]);
  });

  // 点一下画面：把键盘焦点交到页面手里
  canvas.addEventListener('pointerdown', () => {
    canvas.focus();
  });

  // 屏幕方向键：鼠标点、手指按、触控笔都行，不依赖键盘焦点
  document.querySelectorAll('.btn[data-dir]').forEach((btn) => {
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      setDirection(DIRS[btn.dataset.dir]);
    });
  });

  document.getElementById('restart').addEventListener('click', restart);

  // ========== 6. 主循环：每 1/SPEED 秒走一格 ==========
  function start() {
    stop();
    timer = setInterval(() => {
      step();
      draw();
    }, 1000 / SPEED);
  }

  function stop() {
    if (timer !== null) clearInterval(timer);
    timer = null;
  }

  // ========== 7. 重新开始 ==========
  function restart() {
    reset();
    draw();
    start();
  }

  // 启动
  restart();
  </script>
</body>
</html>
